name : MLOps CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  test-build-container-test:

    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: install dependencies
        run: |
          pip install -r requirement.txt
        
      - name: test validations using pytest
        run: |
          pytest

      - name: build docker image
        run: |
          docker build -t iris-docker .

      - name: verify docker images
        run: |
          docker images

      - name: run docker container
        run: |
          docker run -d -p 5000:5000 --name iris-container iris-docker

      - name: wait for docker container
        run: |
          sleep 10
      - name: Test root endpoint
        run: |
          curl http://localhost:5000/
      
      - name: Test prediction endpoint
        run: |
          curl -X POST http://localhost:5000/predict \
          -H "Content-Type: application/json" \
          -d '{"features": [5.1,3.5,1.4,0.2]}'

      - name: Stop Container
        run: |
          docker stop iris-container